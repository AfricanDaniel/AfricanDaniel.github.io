<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 340" role="img" aria-label="Pipeline: Onshape CAD generates a MuJoCo model, which trains a PPO policy in simulation, which exports to TorchScript, which deploys on the real Jetson-controlled robot; real-hardware findings feed back into training.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3a3a3" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="340" fill="#171717" />

  <!-- Stage boxes -->
  <!-- 1: CAD -->
  <rect x="40" y="60" width="180" height="90" rx="10" fill="#262626" stroke="#fb923c" stroke-width="2" />
  <text x="130" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#f5f5f5" font-family="sans-serif">Onshape CAD</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">mesh + mass,</text>
  <text x="130" y="135" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">real kinematics</text>

  <!-- 2: MuJoCo model -->
  <rect x="290" y="60" width="180" height="90" rx="10" fill="#262626" stroke="#fb923c" stroke-width="2" />
  <text x="380" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#f5f5f5" font-family="sans-serif">MuJoCo Model</text>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">dog_description</text>
  <text x="380" y="135" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">+ motor mapping</text>

  <!-- 3: PPO training -->
  <rect x="540" y="60" width="180" height="90" rx="10" fill="#262626" stroke="#fb923c" stroke-width="2" />
  <text x="630" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#f5f5f5" font-family="sans-serif">PPO Training</text>
  <text x="630" y="120" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">dog_gym (sim)</text>
  <text x="630" y="135" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">stand, then walk</text>

  <!-- 4: Export -->
  <rect x="790" y="60" width="180" height="90" rx="10" fill="#262626" stroke="#fb923c" stroke-width="2" />
  <text x="880" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#f5f5f5" font-family="sans-serif">Export</text>
  <text x="880" y="120" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">TorchScript</text>
  <text x="880" y="135" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">SB3 → .pt</text>

  <!-- 5: Real robot -->
  <rect x="1040" y="60" width="180" height="90" rx="10" fill="#262626" stroke="#fb923c" stroke-width="2" />
  <text x="1130" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#f5f5f5" font-family="sans-serif">Real Robot</text>
  <text x="1130" y="120" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">Jetson</text>
  <text x="1130" y="135" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">dog_deploy</text>

  <!-- Forward flow arrows -->
  <line x1="220" y1="105" x2="284" y2="105" stroke="#a3a3a3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="252" y="95" text-anchor="middle" font-size="11" fill="#d4d4d4" font-family="sans-serif">generate</text>

  <line x1="470" y1="105" x2="534" y2="105" stroke="#a3a3a3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="502" y="95" text-anchor="middle" font-size="11" fill="#d4d4d4" font-family="sans-serif">train</text>

  <line x1="720" y1="105" x2="784" y2="105" stroke="#a3a3a3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="752" y="95" text-anchor="middle" font-size="11" fill="#d4d4d4" font-family="sans-serif">export</text>

  <line x1="970" y1="105" x2="1034" y2="105" stroke="#a3a3a3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1002" y="95" text-anchor="middle" font-size="11" fill="#d4d4d4" font-family="sans-serif">deploy</text>

  <!-- Feedback loop: Real Robot -> PPO Training -->
  <path d="M 1130 150 C 1130 260, 630 260, 630 154"
        fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowOrange)" />
  <text x="880" y="278" text-anchor="middle" font-size="12" fill="#fb923c" font-family="sans-serif">real-hardware findings feed back into reward &amp; sim tuning</text>
</svg>
