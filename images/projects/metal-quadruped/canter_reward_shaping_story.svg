<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img"
     aria-label="Animated diagram: reward shaping story for teaching the quadruped to canter, looping every 8 seconds">
  <title>Reward shaping story: teaching the quadruped to canter</title>
  <desc>An 8-second looping schematic animation of three reward-shaping steps: 1) reward bigger,
    faster thigh swings directly, 2) add an antiphase reward for front and back thighs on the same
    side swinging in opposite directions, 3) widen the swing-range cap and restore the antiphase
    weight to its full ceiling until the pattern actually holds, checkpoint
    running_home_s2_ms1000_target5_antiphase_ramp_v2.</desc>
  <style>
    <![CDATA[
      .bg { fill: #171717; }
      .context-label { fill: #a1a1aa; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; }
      .beat-label { fill: #f5f5f5; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; opacity: 0; }
      .dog-body { fill: none; stroke: #fb923c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dog-fill { fill: #fb923c; }
      .foot { fill: #a1a1aa; }
      .ground { stroke: #52525b; stroke-width: 2; stroke-dasharray: 20 20; }
      .dot { fill: #3f3f46; }
      .dot-fill { fill: #fb923c; opacity: 0; }
      .arc-r { stroke: #60a5fa; }
      .arc-l { stroke: #f472b6; }
      .side-arc { opacity: 0; stroke-width: 2; stroke-dasharray: 3 3; fill: none; }
      .faint { opacity: 0.25; }

      @keyframes label1Anim { 0%{opacity:1} 30%{opacity:1} 33%{opacity:0} 100%{opacity:0} }
      @keyframes label2Anim { 0%{opacity:0} 33%{opacity:0} 36%{opacity:1} 63%{opacity:1} 66%{opacity:0} 100%{opacity:0} }
      @keyframes label3Anim { 0%{opacity:0} 66%{opacity:0} 69%{opacity:1} 97%{opacity:1} 99%{opacity:0} 100%{opacity:0} }
      #label1 { animation: label1Anim 8s ease-in-out infinite; }
      #label2 { animation: label2Anim 8s ease-in-out infinite; }
      #label3 { animation: label3Anim 8s ease-in-out infinite; }
      #dot1fill { animation: label1Anim 8s ease-in-out infinite; }
      #dot2fill { animation: label2Anim 8s ease-in-out infinite; }
      #dot3fill { animation: label3Anim 8s ease-in-out infinite; }

      @keyframes scrollAnim { 0%{stroke-dashoffset:0} 33%{stroke-dashoffset:-40} 66%{stroke-dashoffset:-120} 100%{stroke-dashoffset:-420} }
      #ground { animation: scrollAnim 8s linear infinite; }

      @keyframes sideArcAnim { 0%{opacity:0} 37%{opacity:0} 40%{opacity:1} 63%{opacity:1} 66%{opacity:0} 100%{opacity:0} }
      #arcRight, #arcLeft { animation: sideArcAnim 8s ease-in-out infinite; }

      /* Beat 1 (0-33%): modest, symmetric thigh swing (small ROM, all four in loose sync).
         Beat 2 (33-66%): antiphase reward appears -- right-side front/back start opposing, but weak/inconsistent (diluted weight).
         Beat 3 (66-100%): full ROM + full antiphase weight -- confident, consistent canter: right side opposes, left side opposes. */
      @keyframes thighFR { 0%,33%{transform:rotate(0deg)} 38%,50%,62%{transform:rotate(-10deg)} 44%,56%{transform:rotate(8deg)} 66%,74%,82%,90%,98%{transform:rotate(-26deg)} 70%,78%,86%,94%{transform:rotate(20deg)} 100%{transform:rotate(-26deg)} }
      @keyframes thighBR { 0%,33%{transform:rotate(0deg)} 38%,50%,62%{transform:rotate(6deg)} 44%,56%{transform:rotate(-9deg)} 66%,74%,82%,90%,98%{transform:rotate(24deg)} 70%,78%,86%,94%{transform:rotate(-22deg)} 100%{transform:rotate(24deg)} }
      @keyframes thighFL { 0%,33%{transform:rotate(0deg)} 38%,50%,62%{transform:rotate(9deg)} 44%,56%{transform:rotate(-7deg)} 66%,74%,82%,90%,98%{transform:rotate(25deg)} 70%,78%,86%,94%{transform:rotate(-21deg)} 100%{transform:rotate(25deg)} }
      @keyframes thighBL { 0%,33%{transform:rotate(0deg)} 38%,50%,62%{transform:rotate(-7deg)} 44%,56%{transform:rotate(10deg)} 66%,74%,82%,90%,98%{transform:rotate(-23deg)} 70%,78%,86%,94%{transform:rotate(19deg)} 100%{transform:rotate(-23deg)} }
      .thigh-fr { animation: thighFR 8s ease-in-out infinite; }
      .thigh-br { animation: thighBR 8s ease-in-out infinite; }
      .thigh-fl { animation: thighFL 8s ease-in-out infinite; }
      .thigh-bl { animation: thighBL 8s ease-in-out infinite; }

      @keyframes calfSwing { 0%,33%{transform:rotate(0deg)} 44%,56%{transform:rotate(-12deg)} 38%,50%,62%{transform:rotate(0deg)} 70%,78%,86%,94%{transform:rotate(-30deg)} 66%,74%,82%,90%,98%{transform:rotate(0deg)} 100%{transform:rotate(0deg)} }
      .calf-fr, .calf-br, .calf-fl, .calf-bl { animation: calfSwing 8s ease-in-out infinite; }
    ]]>
  </style>

  <rect class="bg" x="0" y="0" width="800" height="450" rx="12"/>
  <text class="context-label" x="30" y="36">Teaching the quadruped to canter — reward shaping, step by step</text>

  <text id="label1" class="beat-label" x="400" y="90">1. Reward bigger, faster thigh swings</text>
  <text id="label2" class="beat-label" x="400" y="90">2. Add antiphase: same-side thighs oppose</text>
  <text id="label3" class="beat-label" x="400" y="90">3. Widen ROM, restore full weight — it sticks</text>

  <line class="ground" x1="140" y1="340" x2="660" y2="340"/>

  <path id="arcRight" class="side-arc arc-r" d="M 380 270 Q 405 230 450 270"/>
  <path id="arcLeft" class="side-arc arc-l" d="M 360 270 Q 405 235 430 270"/>

  <g id="wobbleGroup">
    <g class="thigh-br" style="transform-origin: 430px 275px;">
      <line class="dog-body" x1="430" y1="275" x2="421" y2="305"/>
      <g class="calf-br" style="transform-origin: 421px 305px;">
        <line class="dog-body" x1="421" y1="305" x2="440" y2="340"/>
        <circle class="foot" cx="440" cy="340" r="7"/>
      </g>
    </g>
    <g class="thigh-bl" style="transform-origin: 450px 275px;">
      <line class="dog-body" x1="450" y1="275" x2="446" y2="305"/>
      <g class="calf-bl" style="transform-origin: 446px 305px;">
        <line class="dog-body" x1="446" y1="305" x2="470" y2="340"/>
        <circle class="foot" cx="470" cy="340" r="7"/>
      </g>
    </g>
    <g class="thigh-fl" style="transform-origin: 360px 275px;">
      <line class="dog-body" x1="360" y1="275" x2="332" y2="305"/>
      <g class="calf-fl" style="transform-origin: 332px 305px;">
        <line class="dog-body" x1="332" y1="305" x2="330" y2="340"/>
        <circle class="foot" cx="330" cy="340" r="7"/>
      </g>
    </g>
    <g class="thigh-fr" style="transform-origin: 380px 275px;">
      <line class="dog-body" x1="380" y1="275" x2="357" y2="305"/>
      <g class="calf-fr" style="transform-origin: 357px 305px;">
        <line class="dog-body" x1="357" y1="305" x2="360" y2="340"/>
        <circle class="foot" cx="360" cy="340" r="7"/>
      </g>
    </g>

    <ellipse class="dog-fill" cx="400" cy="255" rx="90" ry="34"/>
    <line class="dog-body" x1="330" y1="248" x2="305" y2="235"/>
    <circle class="dog-fill" cx="298" cy="230" r="17"/>
    <path class="dog-body" d="M 486 255 Q 510 245 500 225" fill="none"/>
  </g>

  <g>
    <circle class="dot" cx="340" cy="425" r="6"/>
    <circle class="dot" cx="400" cy="425" r="6"/>
    <circle class="dot" cx="460" cy="425" r="6"/>
    <circle id="dot1fill" class="dot-fill" cx="340" cy="425" r="6"/>
    <circle id="dot2fill" class="dot-fill" cx="400" cy="425" r="6"/>
    <circle id="dot3fill" class="dot-fill" cx="460" cy="425" r="6"/>
  </g>
</svg>
