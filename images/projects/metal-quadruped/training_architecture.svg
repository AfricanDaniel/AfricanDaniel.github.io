<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Training architecture: the simulation environment (Dog-Stand or Dog-Walk task, with domain randomization over friction and sensor noise) produces one shared observation fed to both the actor and critic networks of a standard PPO agent. The actor outputs 8 target joint angles, stepped in simulation; reward is computed from privileged sim-only state and trains both networks. Difficulty is controlled by manual flags set at launch, not an automated curriculum.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3a3a3" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="760" fill="#171717" />

  <!-- Simulation Environment -->
  <rect x="40" y="30" width="820" height="130" rx="10" fill="#1f1f1f" stroke="#525252" stroke-width="2" />
  <text x="60" y="55" font-size="15" font-weight="600" fill="#f5f5f5" font-family="sans-serif">Simulation Environment (DogEnv)</text>

  <rect x="60" y="70" width="330" height="70" rx="8" fill="#262626" stroke="#fb923c" stroke-width="1.5" />
  <text x="225" y="95" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="sans-serif">Task</text>
  <text x="225" y="115" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">Dog-Stand-v0 / Dog-Walk-v0</text>

  <rect x="410" y="70" width="430" height="70" rx="8" fill="#262626" stroke="#fb923c" stroke-width="1.5" />
  <text x="625" y="90" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="sans-serif">Domain Randomization (opt-in)</text>
  <text x="625" y="108" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">ground friction per reset,</text>
  <text x="625" y="124" text-anchor="middle" font-size="11" fill="#a3a3a3" font-family="sans-serif">gaussian noise on every observation</text>

  <!-- shared observation arrow -->
  <line x1="450" y1="160" x2="450" y2="215" stroke="#a3a3a3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="#d4d4d4" font-family="sans-serif">one shared observation:</text>
  <text x="450" y="207" text-anchor="middle" font-size="10" fill="#a3a3a3" font-family="sans-serif" font-style="italic">motor qpos/qvel + IMU + prev action</text>

  <!-- split to actor + critic -->
  <line x1="230" y1="225" x2="670" y2="225" stroke="#a3a3a3" stroke-width="2" />
  <line x1="230" y1="225" x2="230" y2="255" stroke="#a3a3a3" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="670" y1="225" x2="670" y2="255" stroke="#a3a3a3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="450" y="240" text-anchor="middle" font-size="10" fill="#737373" font-family="sans-serif">(same input to both — no privileged/asymmetric split)</text>

  <!-- Actor box -->
  <rect x="70" y="260" width="320" height="180" rx="10" fill="#262626" stroke="#fb923c" stroke-width="2" />
  <text x="90" y="285" font-size="14" font-weight="600" fill="#f5f5f5" font-family="sans-serif">Actor (policy)</text>
  <!-- mini network icon -->
  <g stroke="#525252" stroke-width="1">
    <line x1="130" y1="320" x2="200" y2="310" /><line x1="130" y1="320" x2="200" y2="335" /><line x1="130" y1="320" x2="200" y2="360" /><line x1="130" y1="320" x2="200" y2="385" />
    <line x1="130" y1="345" x2="200" y2="310" /><line x1="130" y1="345" x2="200" y2="335" /><line x1="130" y1="345" x2="200" y2="360" /><line x1="130" y1="345" x2="200" y2="385" />
    <line x1="130" y1="370" x2="200" y2="310" /><line x1="130" y1="370" x2="200" y2="335" /><line x1="130" y1="370" x2="200" y2="360" /><line x1="130" y1="370" x2="200" y2="385" />
    <line x1="130" y1="395" x2="200" y2="310" /><line x1="130" y1="395" x2="200" y2="335" /><line x1="130" y1="395" x2="200" y2="360" /><line x1="130" y1="395" x2="200" y2="385" />
    <line x1="200" y1="310" x2="270" y2="335" /><line x1="200" y1="335" x2="270" y2="335" /><line x1="200" y1="360" x2="270" y2="335" /><line x1="200" y1="385" x2="270" y2="335" />
    <line x1="200" y1="310" x2="270" y2="360" /><line x1="200" y1="335" x2="270" y2="360" /><line x1="200" y1="360" x2="270" y2="360" /><line x1="200" y1="385" x2="270" y2="360" />
  </g>
  <g fill="#171717" stroke="#60a5fa" stroke-width="1.5">
    <circle cx="130" cy="320" r="6" /><circle cx="130" cy="345" r="6" /><circle cx="130" cy="370" r="6" /><circle cx="130" cy="395" r="6" />
  </g>
  <g fill="#171717" stroke="#a3a3a3" stroke-width="1.5">
    <circle cx="200" cy="310" r="6" /><circle cx="200" cy="335" r="6" /><circle cx="200" cy="360" r="6" /><circle cx="200" cy="385" r="6" />
  </g>
  <g fill="#171717" stroke="#4ade80" stroke-width="1.5">
    <circle cx="270" cy="335" r="6" /><circle cx="270" cy="360" r="6" />
  </g>
  <text x="90" y="420" font-size="10" fill="#a3a3a3" font-family="sans-serif">out: 8 target joint angles</text>

  <!-- Critic box -->
  <rect x="510" y="260" width="320" height="180" rx="10" fill="#262626" stroke="#fb923c" stroke-width="2" />
  <text x="530" y="285" font-size="14" font-weight="600" fill="#f5f5f5" font-family="sans-serif">Critic (value)</text>
  <g stroke="#525252" stroke-width="1">
    <line x1="570" y1="320" x2="640" y2="310" /><line x1="570" y1="320" x2="640" y2="335" /><line x1="570" y1="320" x2="640" y2="360" /><line x1="570" y1="320" x2="640" y2="385" />
    <line x1="570" y1="345" x2="640" y2="310" /><line x1="570" y1="345" x2="640" y2="335" /><line x1="570" y1="345" x2="640" y2="360" /><line x1="570" y1="345" x2="640" y2="385" />
    <line x1="570" y1="370" x2="640" y2="310" /><line x1="570" y1="370" x2="640" y2="335" /><line x1="570" y1="370" x2="640" y2="360" /><line x1="570" y1="370" x2="640" y2="385" />
    <line x1="570" y1="395" x2="640" y2="310" /><line x1="570" y1="395" x2="640" y2="335" /><line x1="570" y1="395" x2="640" y2="360" /><line x1="570" y1="395" x2="640" y2="385" />
    <line x1="640" y1="310" x2="700" y2="350" /><line x1="640" y1="335" x2="700" y2="350" /><line x1="640" y1="360" x2="700" y2="350" /><line x1="640" y1="385" x2="700" y2="350" />
  </g>
  <g fill="#171717" stroke="#60a5fa" stroke-width="1.5">
    <circle cx="570" cy="320" r="6" /><circle cx="570" cy="345" r="6" /><circle cx="570" cy="370" r="6" /><circle cx="570" cy="395" r="6" />
  </g>
  <g fill="#171717" stroke="#a3a3a3" stroke-width="1.5">
    <circle cx="640" cy="310" r="6" /><circle cx="640" cy="335" r="6" /><circle cx="640" cy="360" r="6" /><circle cx="640" cy="385" r="6" />
  </g>
  <g fill="#171717" stroke="#4ade80" stroke-width="1.5">
    <circle cx="700" cy="350" r="6" />
  </g>
  <text x="530" y="420" font-size="10" fill="#a3a3a3" font-family="sans-serif">out: state-value estimate</text>

  <!-- PPO update label between actor/critic -->
  <line x1="390" y1="350" x2="510" y2="350" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 4" />
  <text x="450" y="345" text-anchor="middle" font-size="10" fill="#fb923c" font-family="sans-serif">PPO update</text>

  <!-- Actor -> action -> sim step -->
  <line x1="230" y1="440" x2="230" y2="500" stroke="#a3a3a3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="230" y="465" text-anchor="middle" font-size="11" fill="#d4d4d4" font-family="sans-serif">8 target joint angles</text>

  <rect x="70" y="505" width="320" height="60" rx="8" fill="#262626" stroke="#525252" stroke-width="1.5" />
  <text x="230" y="540" text-anchor="middle" font-size="13" fill="#f5f5f5" font-family="sans-serif">Simulation Step (physics)</text>

  <!-- sim step -> reward -> critic (privileged state) -->
  <line x1="390" y1="535" x2="510" y2="440" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)" />
  <text x="490" y="500" text-anchor="middle" font-size="11" fill="#fb923c" font-family="sans-serif">reward</text>
  <text x="530" y="515" text-anchor="middle" font-size="10" fill="#a3a3a3" font-style="italic" font-family="sans-serif">(from privileged sim state:</text>
  <text x="530" y="529" text-anchor="middle" font-size="10" fill="#a3a3a3" font-style="italic" font-family="sans-serif">true height, tilt, velocity)</text>

  <!-- loop back to env for next obs — routed left of the Actor box (x=20) so it never crosses it -->
  <path d="M 70 535 L 20 535 L 20 95 L 34 95"
        fill="none" stroke="#a3a3a3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="8" y="330" font-size="10" fill="#737373" font-family="sans-serif" transform="rotate(-90 8 330)">next observation (env loop)</text>

  <!-- Manual difficulty knobs box -->
  <rect x="70" y="605" width="760" height="120" rx="10" fill="#1f1f1f" stroke="#525252" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="90" y="630" font-size="13" font-weight="600" fill="#f5f5f5" font-family="sans-serif">Difficulty controls — manual, set at launch (no automated curriculum)</text>
  <text x="90" y="655" font-size="11" fill="#a3a3a3" font-family="sans-serif">--domain-randomization flag (on/off, not scheduled)</text>
  <text x="90" y="675" font-size="11" fill="#a3a3a3" font-family="sans-serif">walk_height_fraction (target standing height)</text>
  <text x="90" y="695" font-size="11" fill="#a3a3a3" font-family="sans-serif">--ent-coef / --learning-rate linear decay over a fixed step budget</text>
  <text x="90" y="715" font-size="11" fill="#a3a3a3" font-family="sans-serif">--init-from a prior checkpoint, to continue training on a new task/reward variant</text>
</svg>
